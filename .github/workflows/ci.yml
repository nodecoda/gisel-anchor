name: ci

on:
  push:
  pull_request:

jobs:
  import-tests:
    # The importer tests drive `python3 -m gisel`, so the two repositories are
    # checked out side by side.  They do not need an LLVM build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: nodecoda/gisel
          path: gisel
          # Pinned on purpose: the evidence names the gisel it was built
          # with.  Bump this and RELEASE.json together.
          ref: 2a7b9d47bd54efe6ce87ee0e738d324a25177fe5
      - name: show the gisel pin
        run: git -C gisel rev-parse HEAD
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: python3 -m pip install -q pytest
      - name: compile
        run: python3 -m compileall -q importer oracle
      - name: bundled pin matches the checkout
        run: python3 tools/sync-package-data.py --check
      - name: importer tests
        run: python3 -m pytest -q importer/tests pin/tests tests
        env:
          GISEL_SRC: ${{ github.workspace }}/gisel
          GISEL_CORPUS: ${{ github.workspace }}/gisel/tests/corpus

  import-check:
    # The acceptance test for the corpus: re-read the pinned upstream sources
    # and require every .gisel file to match byte for byte.  A partial clone of
    # the pinned commit is 7 MB; `git show` fetches each source blob on demand.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: nodecoda/gisel
          path: gisel
          # Pinned on purpose: the evidence names the gisel it was built
          # with.  Bump this and RELEASE.json together.
          ref: 2a7b9d47bd54efe6ce87ee0e738d324a25177fe5
      - name: show the gisel pin
        run: git -C gisel rev-parse HEAD
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: fetch the pinned upstream commit
        run: |
          set -eu
          commit=$(python3 -c 'import json; print(json.load(open("pin/PIN.json"))["commit"])')
          git init -q /tmp/llvm
          git -C /tmp/llvm remote add origin https://github.com/llvm/llvm-project
          git -C /tmp/llvm fetch -q --filter=blob:none --depth 1 origin "$commit"
      - name: reproduce every corpus file
        run: |
          python3 importer/import-cxx.py --all --pin pin/PIN.json \
            --git-repo /tmp/llvm --check
        env:
          GISEL_SRC: ${{ github.workspace }}/gisel
          GISEL_CORPUS: ${{ github.workspace }}/gisel/tests/corpus

  packaging:
    # The product is two console scripts.  If the wheel cannot be installed and
    # run outside the checkout, nobody who only wants the U-side queries can
    # use this repository at all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: build
        run: |
          set -eu
          python3 -m pip install -q build
          python3 -m build --wheel -o /tmp/wheel
      - name: install and run outside the checkout
        run: |
          set -eu
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q /tmp/wheel/*.whl
          work=$(mktemp -d)
          cd "$work"
          /tmp/venv/bin/gisel-import --help > /dev/null
          /tmp/venv/bin/gisel-oracle --help > /dev/null
          /tmp/venv/bin/python - "$GITHUB_WORKSPACE" <<'PY'
          import json, sys
          from importlib.metadata import version, distribution
          from pathlib import Path

          assert version("gisel-anchor") == "0.1.0"
          root = distribution("gisel-anchor").locate_file("")
          pin = json.loads((root / "importer" / "data" / "PIN.json").read_text())
          canonical = json.loads(
              (Path(sys.argv[1]) / "pin" / "PIN.json").read_text())
          assert pin["commit"] == canonical["commit"], pin["commit"]
          print("installed wheel carries pin", pin["commit"][:12])
          PY
